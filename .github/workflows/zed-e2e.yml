name: zed e2e (go)

# Proves the "complement, don't replace" model for the Go toolchain: zed
# publishes go-lib into a hermetic file:// registry, installs it into
# [install].dir, and the Go build resolves it through an ordinary `replace`.
#
# No registry server and no secrets: the file:// registry *is* the registry.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: app
          persist-credentials: false

      # zed-cli path-depends on ../zed-interfaces, so they must be siblings.
      - name: Check out zed-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-cli
          path: zed-cli
          persist-credentials: false
      - name: Check out zed-interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
      - name: Check out the library being consumed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg-test/go-lib
          path: go-lib
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: app/.github/workflows/zed-e2e.yml

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version: "1.22"
          cache: false

      - name: Build the zed CLI
        run: cargo build --release --bin zed --manifest-path zed-cli/Cargo.toml

      - name: Point zed at a hermetic file registry
        run: |
          {
            echo "ZED=$GITHUB_WORKSPACE/zed-cli/target/release/zed"
            echo "ZED_PKG_REGISTRY=file://$RUNNER_TEMP/zed-reg"
            echo "ZED_PKG_HOME=$RUNNER_TEMP/zed-home"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/zed-reg" "$RUNNER_TEMP/zed-home"

      - name: Publish go-lib without mutating its source checkout
        working-directory: go-lib
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          "$ZED" publish --skip-vcs-checks
          # Publishing reads the source tree; it must never write to it.
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$before"
          test "$(find "$RUNNER_TEMP/zed-reg" -name '*.tar.gz' | wc -l)" -eq 1

      - name: The library stands alone before anything is installed
        working-directory: go-lib
        run: go test ./... -count=1

      - name: zed install, then let the Go toolchain resolve it
        working-directory: app
        run: |
          set -euo pipefail
          "$ZED" install --install-mode symlink
          test -L .vendor/.zed/zed-pkg-test/go-lib
          go run . | tee "$RUNNER_TEMP/go-app.log"
          grep -q 'OK: zed-sourced module resolved' "$RUNNER_TEMP/go-app.log"

      - name: A copy install leaves no symlinks behind
        working-directory: app
        run: |
          set -euo pipefail
          "$ZED" install --frozen --install-mode copy
          test ! -L .vendor/.zed/zed-pkg-test/go-lib
          test -z "$(find .vendor/.zed -type l -print -quit)"
          # A copy install must survive with no store mounted at all.
          go run .

      - name: Only the Go package was fetched
        working-directory: app
        run: |
          set -euo pipefail
          installed=.vendor/.zed/zed-pkg-test/go-lib
          test -f "$installed/go.mod"
          test -f "$installed/greet.go"
          # A Go consumer must not receive another ecosystem's manifests.
          for stray in package.json pyproject.toml Cargo.toml; do
            if [ -e "$installed/$stray" ]; then
              echo "::error::$stray leaked into the go package"
              exit 1
            fi
          done

      - name: Upload interoperability diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-go-e2e-log
          path: ${{ runner.temp }}/go-app.log
          if-no-files-found: warn
          retention-days: 7
