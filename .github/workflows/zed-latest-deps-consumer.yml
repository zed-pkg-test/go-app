name: Zed latest deps Go consumer proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-go-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZED_PKG_INTERACTIVE: "false"
    steps:
      - name: Check out consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out locked-build-clean Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: 611da9528940267235ed28391c3b05443380902d
          path: zed-cli
          persist-credentials: false

      - name: Build exact Zed CLI
        working-directory: zed-cli
        run: |
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve latest allowed dependency into a fresh lock
        working-directory: source
        run: |
          set -euo pipefail
          test ! -e .zpkg.lock
          zed validate
          zed install
          test -f .zpkg.lock
          zed validate --require-lock
          zed install --frozen
          test -e zed_modules/zed-pkg-test/go-lib

      - name: Compile and test Go consumer against Zed materialization
        working-directory: source
        run: zed develop --no-install -c 'go test ./...'

      - name: Pack consumer
        working-directory: source
        run: zed pack --out "$RUNNER_TEMP/zed-go-consumer-proof"
